[project]
name = "agent-ask-orama"
version = "0.2.0"
description = "Ask Orama: the general agent for all of lake, delegating to any agent"
readme = "README.md"
authors = [
    { name = "Steve Sperandeo", email = "steve.sperandeo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.19.2",
]

[project.scripts]
agent-ask-orama-serve = "agent_ask_orama:serve"
ask-orama-evals = "agent_ask_orama.evals:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
